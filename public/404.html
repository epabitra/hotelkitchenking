<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Hotel Kitchen King</title>
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages
      // https://github.com/rafgraph/spa-github-pages
      // GitHub Pages has no server-side routing, so a direct hit to a
      // route like /hotelkitchenking/menu serves this 404 page instead.
      // This redirects back to index.html, encoding the intended path
      // in the query string so index.html's script can restore it.
      var pathSegmentsToKeep = 1; // "/hotelkitchenking"

      var l = window.location;
      l.replace(
        l.protocol + "//" + l.hostname + (l.port ? ":" + l.port : "") +
        l.pathname.split("/").slice(0, 1 + pathSegmentsToKeep).join("/") + "/?/" +
        l.pathname.slice(1).split("/").slice(pathSegmentsToKeep).join("/").replace(/&/g, "~and~") +
        (l.search ? "&" + l.search.slice(1).replace(/&/g, "~and~") : "") +
        l.hash
      );
    </script>
  </head>
  <body></body>
</html>
